# 开启 24 位真彩色支持（确保 Neovim 与现代主题色彩不失真）
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# 消除按下 Esc 键时的延迟（对 Neovim 用户至关重要）
set -sg escape-time 0

# 增加历史输出缓冲区行数
set -g history-limit 50000

# 开启焦点事件传递（让 Neovim 的 FocusGained / autoread 正常触发）
set -g focus-events on

# 启用完整鼠标支持（支持点击切换窗格、拖拽调整边框、鼠标滚轮翻页）
set -g mouse on

# 窗口与窗格编号从 1 开始（比从 0 开始更符合键盘数字键排列直觉）
set -g base-index 1
setw -g pane-base-index 1

# 关闭某个窗口后自动重新排列剩余窗口的编号
set -g renumber-windows on

# ==============================================================================
# 2. 前缀键与核心快捷键重映射
# ==============================================================================
# 将前缀键从 Ctrl+b 改为更顺手的 Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 快速重载配置文件（按 Prefix + r 生效）
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reload Successful!"

# 更直观的窗格分割快捷键（在当前路径下打开新窗格）
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新建窗口时继承当前工作目录
bind c new-window -c "#{pane_current_path}"

# ==============================================================================
# 3. 窗格导航与大小调整
# ==============================================================================
# 方式 A：使用 Prefix + h/j/k/l 切换窗格
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 方式 B：无需前缀键，直接使用 Alt + h/j/k/l 快速切换窗格
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 使用 Prefix + 大写 H/J/K/L 微调窗格尺寸（支持连续按键）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# 4. Vi 风格复制模式与系统剪贴板同步
# ==============================================================================
# 启用 Vi 键盘布局操作复制模式（按 Prefix + [ 进入）
setw -g mode-keys vi

# 在复制模式下：按 v 开始选择，按 Ctrl+v 切换矩形块选择，按 y 复制并退出
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==============================================================================
# 5. 极简现代状态栏美化（零外部插件依赖）
# ==============================================================================
# 状态栏置于底部，刷新间隔 5 秒
set -g status-position bottom
set -g status-interval 1

# 整体状态栏配色（深色通透风格，适配 Catppuccin / TokyoNight 等主流主题）
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# 左侧显示当前会话名称（按下前缀键时高亮变色提醒）
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#f38ba8#,fg=#11111b#,bold],#[bg=#89b4fa#,fg=#11111b#,bold]} #S #[bg=#1e1e2e] "

# 右侧显示当前时间与主机名
set -g status-right-length 60
set -g status-right "#[fg=#a6adc8] %H:%M #[bg=#313244,fg=#cdd6f4] #h "

# 窗口标签样式（非活动窗口 vs 当前活动窗口）
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W#{?window_zoomed_flag, [Z],} "

# 窗格边框高亮（区分当前焦点窗格）
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

